name: Bug report
description: Report incorrect behavior with a reproducible example.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Link a minimal repository or provide steps and a small code example. Include the intents, sources and routes involved, and whether the entry point arrived at launch or while the app ran.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: Include the Junction packages, the provider SDK and its version, React and React Native or Expo, and the platform.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Inbox and diagnostics
      description: Include the inbox entry, its state and waiting reason, and the `junction.diagnostics` events around it. Diagnostics carry no payload, URL or account, but remove tokens, keys and personal data from anything else you paste.
